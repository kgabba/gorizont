[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aniso-ok-tuner-3d"
version = "0.1.0"
description = "3D anisotropic OK tuner: MOI az/dip + Optuna CV + FastAPI /tune"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "optuna>=3.0",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]

[project.scripts]
aniso-ok-tuner-3d = "aniso_ok_tuner_3d.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aniso_ok_tuner_3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
