# Production anisotropic IDW (API → TUNER_CONFIG_IDW).
# Optuna: power + search ellipsoid; sector_search auto (Micromine 4/8/16).
# When sector_search=true, Nmin/Nmax are implied (MINOCT×MINPEROC /
# n_sectors×MAXPEROC) and not sampled.
n_min_points: 30
seed: 42
cv:
  n_splits: 5
  grid_nx: 3
  grid_ny: 3
  grid_nz: 2
objective:
  loss: j
  coverage_min: 0.0
  coverage_penalty: 0.0
  empty_rmse_fallback: 1000000.0
search_space:
  r_lo: 0.5
  r_hi: 3.0
  k_min: 0.05
  nmin_lo: 4
  nmin_hi: 12
  nmax_lo: 4
  nmax_hi: 64
  minoct_lo: 1
  minoct_hi: 4
  minperoc_lo: 1
  minperoc_hi: 3
  maxperoc_lo: 1
  maxperoc_hi: 4
optuna:
  n_trials: 400
  n_startup_trials: null
  n_ei_candidates: 256
  flush_every: 50
mode: single
method: anisotropic_idw
idw:
  power_min: 0.5
  power_max: 6.0
# If pass-1 OOF coverage < trigger_below, run pass-2: RMSE + coverage gate.
coverage_fill:
  enabled: true
  trigger_below: 1.0
  pass2_coverage_min: 1.0
  r_expand_factor: 2.0
  n_trials: null
multipass:
  enabled: false
  n_trials_per_pass: 200
  coverage_targets:
  - 0.3
  - 0.6
  - 1.0
  risky_r_major_factor: 2.0
multipass_j:
  max_passes: 3
  n_trials_per_pass: 200
  compare_single: true
# Defaults / A-B helpers. IDW Optuna suggests sector_search (octant_search)
# true/false; when true also n_sectors ∈ {4, 8, 16} + MINOCT/MINPEROC/MAXPEROC.
# Leave force_octant_search unset (auto) so Optuna chooses.
octants:
  octant_search: false
  MINOCT: 2
  MINPEROC: 2
  MAXPEROC: 4
