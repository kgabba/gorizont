# 3D aniso OK + spatial_block CV
isotropic: false

n_min_points: 15

moi:
  azimuth_step_deg: 15.0
  dip_step_deg: 10.0
  dip_min: -80.0
  dip_max: 80.0

directional:
  tolerance_deg: 20.0
  n_lags: 12
  max_dist_percentile: 50.0
  min_pairs: 8

search_space:
  radius_margin: 0.20
  radius_prior_scale: 1.5
  nugget_margin: 0.20
  range_scale_min: 0.80
  range_scale_max: 1.20
  nmax_min: 5
  nmax_max: 40

cv:
  method: spatial_block
  grid_nx: 3
  grid_ny: 3
  grid_nz: 2
  seed: 42

optuna:
  n_trials: 200
  seed: 42
  n_startup_trials: null
  n_ei_candidates: 64
  invalid_penalty: 1000000.0
