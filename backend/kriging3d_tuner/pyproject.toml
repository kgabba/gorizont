[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kriging3d-tuner"
version = "0.1.0"
description = "3D ANISO Ordinary Kriging tuner: fixed variogram ellipsoid + Optuna search neighbourhood"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "optuna>=3.0",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
]

[project.scripts]
kriging3d-tuner = "kriging3d_tuner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
