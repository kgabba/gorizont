# anisotropy3d defaults — all thresholds for anisotropy estimation

n_min_points: 30
near_zero_var_eps: 1.0e-12
# PCA eigenvalues / total: below → linear; second cumsum below → planar
degeneracy_linear_frac: 0.02
# third PCA eigenvalue fraction below this → treat as planar
degeneracy_planar_frac: 0.02
coord_dup_decimals: 6

detector:
  mode: moi3d                 # moi3d | legacy_range_ellipsoid

moi:
  isotropy_ratio_max: 1.30    # max/min MOI eigenvalue; ≤ → ISO (preliminary)
  distance_power: 2.5         # mass = C / d^power
  # Mid-lag window (fractions of max_dist): near-origin C≈1 is nearly isotropic
  # and would dominate mass via 1/d^power without a lag gate.
  lag_frac_of_max_dist_min: 0.2
  lag_frac_of_max_dist_max: 0.9

pairs:
  max_dist: null              # null → percentile of all pairwise distances
  max_dist_percentile: 50.0
  max_pairs: 200000           # subsample if more; null = no cap
  seed: 42

variogram:
  model: spherical
  n_lags: 12
  min_pairs_per_lag: 8
  # omni fit: free nugget, sill, range (weighted by n_pairs)
  # directional coarse scan: fix nugget/sill near omni, free range only

directions:
  n_directions: 96            # Fibonacci hemisphere
  angular_tolerance_deg: 22.5
  bandwidth: null             # absolute; null → disable bandwidth gate
  bandwidth_frac_max_dist: null
  min_pairs: 40
  min_valid_lags: 4
  range_boundary_frac: 0.98   # range >= frac * upper_bound → exclude from SPD fit

ellipsoid:
  weight_n_pairs_pow: 1.0
  weight_n_lags_pow: 0.5
  weight_sse_eps: 1.0e-6
  lambda_min: 1.0e-18
  max_iter: 200

refinement:
  n_lags: 16
  angular_tolerance_deg: 18.0
  bandwidth: null
  local_orient_max_deg: 8.0   # 0 → skip local SO(3) refine
  local_orient_steps: 5

classification:
  ratio_iso_max: 1.3          # maj/min below → ISOTROPIC
  ratio_equal_max: 1.3        # axes "equal" if ratio < this

confidence:
  nugget_frac_high: 0.45      # diagnostics only — does NOT auto-force ISO
  min_valid_directions: 12
  min_valid_frac: 0.25        # of n_directions
  max_ellipsoid_rmse_rel: 0.35  # relative residual on 1/r^2
  high_min_valid_directions: 24
  high_max_ellipsoid_rmse_rel: 0.15
  # SVD σ_min/σ_max of valid direction unit vectors; below → coverage bad
  coverage_min_sv_ratio: 0.05

output:
  write_png: true
