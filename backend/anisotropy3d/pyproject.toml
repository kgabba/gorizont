[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anisotropy3d"
version = "0.1.0"
description = "3D spatial continuity anisotropy (variogram ellipsoid) from X,Y,Z,Value"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]

[project.scripts]
anisotropy3d = "anisotropy3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
